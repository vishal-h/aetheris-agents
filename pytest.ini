# pytest configuration for the aetheris-agents repo (BL-152).
#
# Why pytest.ini and not pyproject.toml: this is a polyglot tree (Elixir .exs,
# Rust under provenance/scanner and rig/src-tauri, TypeScript under rig/). A root
# pyproject.toml is discovered by pip, build backends, uv/poetry, ruff, black and
# mypy whether or not it configures them; pytest.ini is read by pytest and by
# nothing else. Narrowest file that does the job.
#
# Its two jobs:
#
#   1. Pin rootdir to the repo root for every invocation, scoped or not, so a
#      run's behaviour no longer depends on the directory it was launched from.
#
#   2. --import-mode=importlib. Under pytest's default "prepend" mode a test
#      module's importable name is derived from its first ancestor directory
#      without an __init__.py, so this tree produced three separate collisions
#      that made whole-tree collection impossible:
#        - tests/conftest.py and cloudcost/tests/conftest.py both claimed the
#          top-level name `conftest`, so cloudcost's `from conftest import
#          FIXTURES` resolved to the wrong file (8 collection errors);
#        - email/tests/ and provenance/mcp/corpus-search/tests/ both claimed the
#          top-level package name `tests`;
#        - and the surviving module names depended on invocation order.
#      importlib mode derives each module name from its full path instead, so no
#      two files can collide. Test-module imports no longer go through sys.path;
#      each tests/conftest.py still inserts its own scripts/ dir as before.
[pytest]
addopts = --import-mode=importlib

# Two markers, two different reasons, deliberately never merged. Both are excluded
# from the whole-suite gate, each has its own command, and tests/conftest.py reports
# the two deselected counts separately in ordinary output — a reader who finds a
# deselected test can tell which reason applies without asking anyone. (That hook
# lives in tests/conftest.py rather than a root conftest.py because a conftest.py at
# the rootdir is imported under the bare module name `conftest`, which shadows it for
# the ten runtime `from conftest import ...` lines in cloudcost/tests/.)
#
# `integration` is registered here as well as in the per-use-case conftest.py files,
# because provenance/tests/ has no pytest_configure and would otherwise warn.
# `markers` is a LINE LIST: one marker per line, and an indented continuation line is
# parsed as a whole new marker, not as more of the previous one. So each entry below is
# a single line however long, and the long form lives in the comments here.
#
# integration — TEST MECHANICS. A test carries it because it depends on state outside
#   this repo's tracked tree: a live external service or credential, an installed
#   external binary, the sibling ../aetheris harness, or gitignored local data files.
#   Never applied because a test is slow, and never because it fails — a red test is
#   reported red, not marked. A test that spawns python3 against this repo's own
#   tracked scripts on hermetic inputs is the standard idiom here and stays in the gate.
#   Its own command:  python3 -m pytest -q -m "integration and not dormant"
#
# dormant — BUSINESS STATE, not test mechanics. The use case's work is paused, so its
#   tests are deselected from the gate rather than gating it. Dormant tests STILL
#   COLLECT AND STILL IMPORT: deselect at run time, never at import, because a use case
#   whose tests stop collecting is one nobody notices has rotted — the defect BL-152
#   exists to remove.
#     Currently dormant: boxy-pipeline, since 2026-08-16, paused pending the client.
#     CONDITION FOR RETURN: it runs again when boxy-pipeline work resumes. To restore
#     it, delete the `pytestmark = pytest.mark.dormant` lines from
#     boxy-pipeline/tests/test_*.py; nothing else was changed for the pause.
#   Its own command, documented and run by no gate:  python3 -m pytest -q -m dormant
markers =
    integration: TEST MECHANICS — depends on state outside this repo's tracked tree (live service or credential, external binary, the sibling ../aetheris harness, gitignored local data). Never applied for slowness and never for failure. See the comment block above pytest.ini's `markers` for the long form.
    dormant: BUSINESS STATE — the use case's work is paused, so its tests are deselected from the gate rather than gating it; they still collect and still import. Currently boxy-pipeline, since 2026-08-16, pending the client. See the comment block above pytest.ini's `markers` for the condition for return.
